name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test --test-concurrency=1 tests/*.test.js
      - name: 安装风铃 Python 依赖（PyQt6 + 系统库 + xvfb）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3
          pip3 install --break-system-packages PyQt6
      - name: 安装解语花插件 + 链接风铃插件（融合球测试依赖：融合球复用两边正式面板）
        run: |
          mkdir -p ~/.hanako/plugins
          git clone --depth 1 https://github.com/moononnn/hanako-jieyuhua.git ~/.hanako/plugins/jiegehua
          ln -s "$GITHUB_WORKSPACE" ~/.hanako/plugins/work-visit
      - name: Python 风铃回归（DSP/交互/布局）
        run: |
          export HANA_PLUGINS_DIR="$HOME/.hanako/plugins"
          xvfb-run -a python3 -m unittest discover -s tests -p "test_fengling_*.py"
      - name: 命名红线检查
        env:
          REDLINE_NAMES: ${{ secrets.REDLINE_NAMES }}
        run: |
          if [ -z "$REDLINE_NAMES" ]; then
            echo "::error::未配置 REDLINE_NAMES 机密（仓库 Settings → Secrets and variables → Actions），请先添加禁用词名单，再重新运行本检查"
            echo "名单格式：名字1|名字2|..."
            exit 1
          fi
          if git grep -n -I -E "$REDLINE_NAMES" -- .; then
            echo "::error::外传内容命名红线命中，请清理后重新提交"
            exit 1
          fi
          echo "命名红线检查通过 ✓"
