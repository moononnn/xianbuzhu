name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node --test tests/*.test.js
      - name: 安装风铃 Python 依赖（PyQt6 + xvfb）
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip3 install --break-system-packages PyQt6
      - name: Python 风铃回归（DSP/交互/布局）
        run: xvfb-run -a python3 -m unittest discover -s tests -p "test_fengling_*.py"
      - name: 命名红线检查
        run: |
          if git grep -n -I -E "玥儿|绯月|雪奈|悠米|柚月|星眠" -- . ':(exclude).github/workflows/ci.yml'; then
            echo "::error::外传内容命名红线命中（玥儿/绯月/雪奈/悠米/柚月/星眠），请清理后重新提交"
            exit 1
          fi
          echo "命名红线检查通过 ✓"
